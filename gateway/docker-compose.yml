version: '3.8'

services:
  mongo1:
    image: mongo:7.0
    container_name: govpay-mongo1
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    command: ["--replSet", "govpayRS", "--bind_ip_all"]
    volumes:
      - mongo1_data:/data/db
    networks:
      - govpay-net

  mongo2:
    image: mongo:7.0
    container_name: govpay-mongo2
    restart: always
    ports:
      - "127.0.0.2:27017:27017"
    command: ["--replSet", "govpayRS", "--bind_ip_all"]
    volumes:
      - mongo2_data:/data/db
    networks:
      - govpay-net

volumes:
  mongo1_data:
  mongo2_data:

networks:
  govpay-net:
    driver: bridge